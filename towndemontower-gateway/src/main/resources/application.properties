# ⚠️ 本文件当前**不被任何代码读取**（网关不是 Spring 服务，无配置文件加载）。
# 实际配置入口是环境变量 / 同名 -D 系统属性，清单见 docs/39-网关接入指南.md §3。
# 保留此文件只为留下早期 Spring Boot 方案的痕迹；改这里的值不会生效。
#
# 墨铠网关（镇妖塔网关形态）运行配置
# 端口
server.port=8080

# 服务端配置身份：ExecutionContext 由服务端提供（docs/38 决策②）
inkarmor.gateway.agent-id=gateway-default-agent
inkarmor.gateway.mode=DEV_EXECUTION
inkarmor.gateway.tainted=false

# 审计落盘路径（每次调用都写哈希链审计）；Docker 中挂到 /app/data/audit 卷
inkarmor.gateway.audit-path=./data/audit/gateway.log

# 客户端令牌：优先环境变量 INKARMOR_API_TOKEN；未配则所有写请求 403（fail-closed）
inkarmor.gateway.api-token=${INKARMOR_API_TOKEN:}
