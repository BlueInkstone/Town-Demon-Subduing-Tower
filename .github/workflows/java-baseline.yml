name: java-baseline

# 两档版本卡口：core / gateway 必须能编能跑在 Java 8；Spring 三模块必须在 Java 17。
# 目的不是"跑一遍测试"，而是挡住三类回归：
#   1) core 里写进 record / List.of / Stream.toList() 这类 9+ 写法；
#   2) 有人把 java.version 抬到 21/25（Spring Boot 3.2.5 的 ASM 读不了 class 69）；
#   3) 增量编译把旧 JDK 的字节码留在 target/ 里，再被打包分发。
on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.module }} @ JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: towndemontower-core,           jdk: '8',  major: 52 }
          - { module: towndemontower-gateway,        jdk: '8',  major: 52 }
          - { module: towndemontower-spring-starter, jdk: '17', major: 61 }
          - { module: towndemontower-delivery,       jdk: '17', major: 61 }
          - { module: towndemontower-agents,         jdk: '17', major: 61 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      # 仓库没有根聚合 pom，下游模块靠本地仓库里的 core / starter 解析依赖，所以先装上游。
      # core 自己这一档不装（避免用被测产物当输入）。
      - name: Install upstream modules
        if: matrix.module != 'towndemontower-core'
        run: |
          mvn -B -q -f towndemontower-core/pom.xml -DskipTests install
          if [ "${{ matrix.module }}" = "towndemontower-delivery" ] || [ "${{ matrix.module }}" = "towndemontower-agents" ]; then
            mvn -B -q -f towndemontower-spring-starter/pom.xml -DskipTests install
          fi

      # 必须走到 package：断言要看 jar，mvn test 不产 jar，会让卡口自己挂掉。
      # 带 clean：增量编译留在 target/ 里的高版本 class 不该被带进这次构建。
      - name: Compile, test and package
        run: mvn -B -f ${{ matrix.module }}/pom.xml clean package

      # 卡口本体：本模块产出的每一个 class 都必须是目标档位。
      # 光扫 jar 不够：测试类不进 jar，而 IDE 曾把 V19 测试类编成 class 65 留在 target/test-classes，
      # 在 JRE 8 上直接 UnsupportedClassVersionError。这里把编译目录一并扫掉。
      - name: Assert bytecode level
        run: |
          python3 - "${{ matrix.module }}" "${{ matrix.major }}" <<'PY'
          import glob, sys, zipfile

          module, expected = sys.argv[1], int(sys.argv[2])
          bad, checked = [], 0

          def check(label, head):
              global checked
              checked += 1
              major = head[6] * 256 + head[7]
              if major != expected:
                  bad.append(f'{label} -> {major}')

          for jar in glob.glob(f'{module}/target/*.jar'):
              with zipfile.ZipFile(jar) as z:
                  for name in z.namelist():
                      if name.endswith('.class'):
                          check(f'{jar}:{name}', z.read(name)[:8])

          for root in (f'{module}/target/classes', f'{module}/target/test-classes'):
              for path in glob.glob(f'{root}/**/*.class', recursive=True):
                  with open(path, 'rb') as f:
                      check(path, f.read(8))

          if bad:
              print('\n'.join(bad[:10]))
              sys.exit(f'bytecode mismatch: expected class {expected}')
          if not checked:
              sys.exit(f'no class produced by {module}')

          print(f'OK {module} -> class {expected} ({checked} classes)')
          PY
