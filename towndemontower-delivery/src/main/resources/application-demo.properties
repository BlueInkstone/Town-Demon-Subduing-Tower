# =====================================================================
# Town Demon-Subduing Tower —— 交付进度看板 演示配置
# =====================================================================
# 本文件以 profile 形式提供：application-demo.properties 只在激活 demo profile
# 时生效，不会污染接入方应用自己的 application.properties。
#
# 启动（独立演示）：
#   mvn -o spring-boot:run -Dspring-boot.run.profiles=demo
#   或 java -jar target/towndemontower-delivery-0.1.0.jar --spring.profiles.active=demo
#
# 看板：http://127.0.0.1:8080/delivery/
# =====================================================================

server.port=8080

# ---- 交付看板模块开关 ----
towndemontower.delivery.enabled=true
# 写操作接入 core 治理链（审计哈希链 + 风险闸门 + RBAC）
towndemontower.delivery.governed=true
# 看板使用的 RBAC 主体
towndemontower.delivery.agent-id=delivery-board-agent
# 持久化：memory（默认，重启重置）| file（落盘到 data-file）
towndemontower.delivery.storage=memory
towndemontower.delivery.data-file=delivery-items.data
# 演示数据播种（首次启动写入数据）
# seed-mode=project（默认）：播种本产品（Town Demon-Subduing Tower）自身的真实交付路线图
# seed-mode=sample         ：播种通用样例数据（覆盖四种状态的虚构阶段）
towndemontower.delivery.demo-data=true
towndemontower.delivery.seed-mode=project

# ---- 治理内核（starter）----
towndemontower.enabled=true

# ---- 日志降噪：演示时只看关键信息 ----
logging.level.com.towndemontower=INFO
logging.level.org.springframework=WARN
