<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镇妖塔 · Agent 花名册</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --panel-2:#fafbfc;
    --text:#1f2733; --text-dim:#5b6675; --text-mute:#8a94a3;
    --line:#e3e8ef; --line-strong:#cfd6e0;
    --brand:#3b6fd4; --brand-soft:#eaf0fc;
    --ok:#1f9254; --ok-soft:#e6f4ec;
    --warn:#c77b12; --warn-soft:#fdf1de;
    --info:#2b6cb0; --info-soft:#e5effa;
    --idle:#6b7684; --idle-soft:#eef0f3;
    --danger:#c0392b; --danger-soft:#fbeae8;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --panel:#1a1f27; --panel-2:#20262f;
      --text:#e6eaf0; --text-dim:#a4aebc; --text-mute:#7c8796;
      --line:#2a323d; --line-strong:#39424f;
      --brand:#6b9bf0; --brand-soft:#1e2a3f;
      --ok:#4ec27f; --ok-soft:#16301f;
      --warn:#e0a63f; --warn-soft:#332612;
      --info:#63a4e8; --info-soft:#16283c;
      --idle:#96a1b0; --idle-soft:#242b34;
      --danger:#e8776a; --danger-soft:#331b18;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:1400px;margin:0 auto;}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px;}
  .sub{color:var(--text-mute);font-size:12.5px;margin-top:3px;}
  .header-right{display:flex;align-items:center;gap:12px;}
  .clock{color:var(--text-mute);font-size:12px;font-variant-numeric:tabular-nums;}

  .banner{padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;display:none;align-items:center;gap:10px;font-size:13.5px;}
  .banner.show{display:flex;}
  .banner.error{background:var(--danger-soft);color:var(--danger);}
  .banner.warn{background:var(--warn-soft);color:var(--warn);}
  .banner.info{background:var(--info-soft);color:var(--info);}
  .banner button{margin-left:auto;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
  .card .k{color:var(--text-dim);font-size:12px;}
  .card .v{font-size:24px;font-weight:660;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.4px;}
  .card .v small{font-size:13px;font-weight:500;color:var(--text-mute);margin-left:2px;}
  .card.hero{background:linear-gradient(135deg,var(--brand-soft),var(--panel));border-color:var(--brand);}
  .card.hero .v{color:var(--brand);}
  .card.warn .v{color:var(--warn);}
  .card.bad .v{color:var(--danger);}
  .bar-outer{height:6px;border-radius:99px;background:var(--idle-soft);overflow:hidden;margin-top:8px;}
  .bar-inner{height:100%;border-radius:99px;background:var(--brand);transition:width .35s ease;}

  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar label{color:var(--text-dim);font-size:13px;}
  .toolbar .spacer{flex:1;}
  button,select,input{
    font:inherit;color:var(--text);background:var(--panel);
    border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;
  }
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  button{cursor:pointer;transition:.15s;}
  button:hover{border-color:var(--brand);color:var(--brand);}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:560;}
  button.primary:hover{filter:brightness(1.06);color:#fff;}
  button.link{border:none;background:none;color:var(--brand);padding:2px 6px;}
  button.link:hover{text-decoration:underline;}
  .check{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;cursor:pointer;user-select:none;}
  .check input{width:15px;height:15px;accent-color:var(--brand);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;}
  th{background:var(--panel-2);color:var(--text-dim);font-weight:600;font-size:12.5px;white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel-2);}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap;}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--text-dim);}
  .empty{padding:48px 16px;text-align:center;color:var(--text-mute);}

  .tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:560;white-space:nowrap;}
  .tag::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;}
  .tag.ACTIVE{color:var(--ok);background:var(--ok-soft);}
  .tag.PAUSED{color:var(--warn);background:var(--warn-soft);}
  .tag.SUSPENDED{color:var(--danger);background:var(--danger-soft);}
  .tag.RETIRED{color:var(--idle);background:var(--idle-soft);}
  .tag.sync-ok{color:var(--ok);background:var(--ok-soft);}
  .tag.sync-bad{color:var(--danger);background:var(--danger-soft);}
  .tag.plain{color:var(--text-dim);background:var(--idle-soft);}
  .tag.plain::before{display:none;}

  .chips{display:flex;flex-wrap:wrap;gap:5px;max-width:320px;}
  .chip{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--idle-soft);color:var(--text-dim);white-space:nowrap;}
  .chip.on{background:var(--ok-soft);color:var(--ok);}
  .chip.miss{background:var(--danger-soft);color:var(--danger);}
  .chip.extra{background:var(--warn-soft);color:var(--warn);}

  /* 侧边抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(16,24,40,.35);display:none;z-index:40;}
  .drawer-mask.show{display:block;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:520px;max-width:100vw;
    background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);
    z-index:41;transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);}
  .drawer-head h2{margin:0;font-size:17px;font-weight:640;}
  .drawer-body{padding:16px 20px;overflow:auto;flex:1;}
  .drawer-body h3{margin:18px 0 8px;font-size:13px;color:var(--text-dim);font-weight:620;letter-spacing:.3px;text-transform:none;}
  .drawer-body h3:first-child{margin-top:0;}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px;}
  .kv .k{color:var(--text-mute);}
  .diff-note{font-size:12px;color:var(--text-mute);margin-top:6px;}

  .toast{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:60;}
  .toast div{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:360px;}

  footer{color:var(--text-mute);font-size:12px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);}
  footer code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px;}

  @media (max-width:768px){ body{padding:14px;} .drawer{width:100%;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>镇妖塔 · Agent 花名册</h1>
      <div class="sub">员工档案是 RBAC 权限的权威来源：入职授予、离职回收。<b>应然</b>是档案里写的，<b>实然</b>是当前真正生效的。</div>
    </div>
    <div class="header-right">
      <span class="clock" id="clock">—</span>
      <button onclick="reload()">刷新</button>
    </div>
  </header>

  <div class="banner" id="banner"><span id="banner-text"></span><button onclick="reload()">重试</button></div>

  <section class="cards">
    <div class="card hero">
      <div class="k">权限覆盖率</div>
      <div class="v" id="c-coverage">0<small>%</small></div>
      <div class="bar-outer"><div class="bar-inner" id="c-bar" style="width:0%"></div></div>
    </div>
    <div class="card"><div class="k">总人数</div><div class="v" id="c-total">0</div></div>
    <div class="card"><div class="k">在职（可执行）</div><div class="v" id="c-active">0</div></div>
    <div class="card"><div class="k">暂停</div><div class="v" id="c-paused">0</div></div>
    <div class="card warn"><div class="k">停用</div><div class="v" id="c-suspended">0</div></div>
    <div class="card"><div class="k">离职</div><div class="v" id="c-retired">0</div></div>
    <div class="card"><div class="k">平均技能</div><div class="v" id="c-skills">0</div></div>
    <div class="card bad" id="card-drift" style="display:none">
      <div class="k">权限不一致</div>
      <div class="v" id="c-drift">0</div>
    </div>
  </section>

  <div class="toolbar">
    <label for="f-status">状态</label>
    <select id="f-status" onchange="applyFilters()"><option value="">全部</option></select>
    <label for="f-role">岗位</label>
    <select id="f-role" onchange="applyFilters()"><option value="">全部</option></select>
    <input id="f-keyword" placeholder="搜工号 / 姓名 / 备注" style="min-width:200px" oninput="applyFilters()">
    <label class="check"><input type="checkbox" id="f-drift" onchange="applyFilters()">只看权限不一致</label>
    <div class="spacer"></div>
    <span id="count-hint" style="color:var(--text-mute);font-size:12.5px"></span>
  </div>

  <div class="panel">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>工号</th><th>姓名</th><th>岗位</th><th>状态</th><th>模型档位</th>
            <th>技能</th><th>权限（应然 / 实然）</th><th>一致性</th><th>入职</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="10" class="empty">加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    本页只读：状态流转、权限授予等写操作走治理链（可能被风险闸门拦下或挂人工审批），不在页面上直接做。
    接口：<code>GET /api/agents</code>、<code>/summary</code>、<code>/meta</code>。
  </footer>
</div>

<div class="drawer-mask" id="drawer-mask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <h2 id="d-name">—</h2>
      <div class="sub" id="d-id">—</div>
    </div>
    <button onclick="closeDrawer()">关闭</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var API = "/api/agents";
  var all = [];          // 当前查询返回的全部 Agent
  var meta = null;

  function $(id){ return document.getElementById(id); }

  function toast(msg){
    var box = $("toast");
    var d = document.createElement("div");
    d.textContent = msg;
    box.appendChild(d);
    setTimeout(function(){
      d.style.transition = "opacity .3s"; d.style.opacity = "0";
      setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 320);
    }, 3000);
  }

  function showBanner(text, kind){
    var b = $("banner");
    b.className = "banner show " + (kind || "info");
    $("banner-text").textContent = text;
  }

  function hideBanner(){ $("banner").className = "banner"; }

  function fmt(dt){
    if(!dt) return "—";
    return String(dt).replace("T"," ").slice(0,19);
  }

  function esc(s){
    if(s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function req(url){
    return fetch(url, {headers:{"Accept":"application/json"}}).then(function(res){
      return res.text().then(function(txt){
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch(e){ data = null; }
        if(!res.ok){
          var err = new Error((data && (data.message || data.error)) || ("HTTP " + res.status));
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  // ===== 初始化：先拿 meta（筛选选项），再拉数据 =====
  function boot(){
    tick();
    setInterval(tick, 1000);
    req(API + "/meta").then(function(m){
      meta = m || {};
      fillSelect("f-status", (meta.statuses || []), "code", "label");
      fillSelect("f-role", (meta.roles || []), "code", "label");
    }).catch(function(){
      // meta 拿不到不阻塞列表
    }).then(function(){
      reload();
    });
  }

  function fillSelect(id, items, vKey, lKey){
    var sel = $(id);
    var keep = sel.value;
    sel.innerHTML = '<option value="">全部</option>';
    items.forEach(function(it){
      var o = document.createElement("option");
      o.value = it[vKey];
      o.textContent = it[lKey] || it[vKey];
      sel.appendChild(o);
    });
    sel.value = keep || "";
  }

  function tick(){
    var d = new Date();
    var p = function(n){ return (n < 10 ? "0" : "") + n; };
    $("clock").textContent = d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
      + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  // ===== 数据加载 =====
  window.reload = function(){
    hideBanner();
    Promise.all([req(API), req(API + "/summary")]).then(function(r){
      all = r[0] || [];
      renderSummary(r[1] || {});
      applyFilters();
    }).catch(function(e){
      $("rows").innerHTML = '<tr><td colspan="10" class="empty">加载失败：' + esc(e.message) + '</td></tr>';
      if(e.status === 401 || e.status === 403){
        showBanner("没有读取权限（" + e.message + "）。若服务开了 token 模式，需要在网关上带上 Bearer 令牌。", "warn");
      } else {
        showBanner("加载失败：" + e.message + "（确认应用跑在 :8081 且 /api/agents 可访问）", "error");
      }
    });
  };

  function renderSummary(s){
    $("c-coverage").innerHTML = (s.permissionCoverage === undefined || s.permissionCoverage === null ? "—" : s.permissionCoverage) + '<small>%</small>';
    $("c-bar").style.width = Math.max(0, Math.min(100, Number(s.permissionCoverage) || 0)) + "%";
    $("c-total").textContent = s.total === undefined ? "—" : s.total;
    $("c-active").textContent = s.executableCount === undefined ? "—" : s.executableCount;
    $("c-paused").textContent = s.pausedCount === undefined ? "—" : s.pausedCount;
    $("c-suspended").textContent = s.suspendedCount === undefined ? "—" : s.suspendedCount;
    $("c-retired").textContent = s.retiredCount === undefined ? "—" : s.retiredCount;
    $("c-skills").textContent = s.avgSkillCount === undefined ? "—" : s.avgSkillCount;
  }

  // ===== 筛选（前端过滤，服务端也支持同名参数）=====
  window.applyFilters = function(){
    var status = $("f-status").value;
    var role = $("f-role").value;
    var kw = ($("f-keyword").value || "").trim().toLowerCase();
    var onlyDrift = $("f-drift").checked;

    var list = all.filter(function(a){
      if(status && a.status !== status) return false;
      if(role && a.role !== role) return false;
      if(onlyDrift && a.permissionsInSync !== false) return false;
      if(kw){
        var hay = [a.id, a.name, a.note].filter(Boolean).join(" ").toLowerCase();
        if(hay.indexOf(kw) < 0) return false;
      }
      return true;
    });

    var drift = all.filter(function(a){ return a.permissionsInSync === false; }).length;
    $("card-drift").style.display = drift > 0 ? "" : "none";
    $("c-drift").textContent = drift;
    $("count-hint").textContent = "显示 " + list.length + " / " + all.length + " 人";

    renderRows(list);
  };

  function renderRows(list){
    var body = $("rows");
    if(!list.length){
      body.innerHTML = '<tr><td colspan="10" class="empty">没有符合条件的 Agent</td></tr>';
      return;
    }
    var html = "";
    list.forEach(function(a){
      var perms = a.permissions || [];
      var eff = a.effectivePermissions || [];
      var sync = a.permissionsInSync !== false;
      html += '<tr>'
        + '<td class="mono">' + esc(a.id) + '</td>'
        + '<td><b>' + esc(a.name) + '</b>' + (a.note ? '<div class="sub">' + esc(a.note) + '</div>' : '') + '</td>'
        + '<td>' + esc(a.roleLabel || a.role) + '</td>'
        + '<td><span class="tag ' + esc(a.status) + '">' + esc(a.statusLabel || a.status) + '</span></td>'
        + '<td><span class="tag plain">' + esc(a.modelTierLabel || a.modelTier || "—") + '</span></td>'
        + '<td class="num">' + (a.skills ? a.skills.length : 0) + '</td>'
        + '<td class="num">' + perms.length + ' / <b>' + eff.length + '</b></td>'
        + '<td>' + (sync
            ? '<span class="tag sync-ok">一致</span>'
            : '<span class="tag sync-bad">不一致</span>') + '</td>'
        + '<td class="num">' + (a.registeredDays === undefined || a.registeredDays === null ? "—" : a.registeredDays + " 天") + '</td>'
        + '<td><button class="link" onclick="openDrawer(\'' + esc(a.id) + '\')">详情</button></td>'
        + '</tr>';
    });
    body.innerHTML = html;
  }

  // ===== 详情抽屉：应然 vs 实然 对比 =====
  window.openDrawer = function(id){
    var a = all.filter(function(x){ return x.id === id; })[0];
    if(!a) return;
    $("d-name").textContent = a.name + "（" + a.id + "）";
    $("d-id").textContent = (a.roleLabel || a.role) + " · " + (a.statusLabel || a.status)
      + " · " + (a.modelTierLabel || a.modelTier || "—");

    var declared = a.permissions || [];
    var effective = a.effectivePermissions || [];
    var missing = declared.filter(function(p){ return effective.indexOf(p) < 0; });
    var extra = effective.filter(function(p){ return declared.indexOf(p) < 0; });

    var html = "";
    html += '<h3>档案</h3><div class="kv">'
      + '<div class="k">工号</div><div>' + esc(a.id) + '</div>'
      + '<div class="k">岗位</div><div>' + esc(a.roleLabel || a.role) + (a.roleCode ? '（' + esc(a.roleCode) + '）' : '') + '</div>'
      + '<div class="k">状态</div><div><span class="tag ' + esc(a.status) + '">' + esc(a.statusLabel || a.status) + '</span>'
      + (a.canAct ? ' 可执行' : ' 不可执行') + '</div>'
      + '<div class="k">模型档位</div><div>' + esc(a.modelTierLabel || a.modelTier || "—") + '</div>'
      + '<div class="k">入职时间</div><div>' + fmt(a.registeredAt) + '（' + (a.registeredDays || 0) + ' 天）</div>'
      + '<div class="k">创建 / 更新</div><div>' + fmt(a.createdAt) + ' / ' + fmt(a.updatedAt) + '</div>'
      + (a.note ? '<div class="k">备注</div><div>' + esc(a.note) + '</div>' : '')
      + '</div>';

    html += '<h3>技能（' + (a.skills ? a.skills.length : 0) + '）</h3>';
    html += a.skills && a.skills.length
      ? '<div class="chips">' + a.skills.map(function(s){ return '<span class="chip">' + esc(s) + '</span>'; }).join("") + '</div>'
      : '<div class="diff-note">未配置技能</div>';

    html += '<h3>权限：应然 ' + declared.length + ' / 实然 ' + effective.length + '</h3>';
    html += '<div class="chips">';
    if(!declared.length && !effective.length){
      html += '<span class="diff-note">没有任何权限</span>';
    } else {
      declared.forEach(function(p){
        var on = effective.indexOf(p) >= 0;
        html += '<span class="chip ' + (on ? "on" : "miss") + '" title="' + (on ? "档案有，且已生效" : "档案有，但未生效") + '">'
          + esc(p) + (on ? '' : ' ✕') + '</span>';
      });
      extra.forEach(function(p){
        html += '<span class="chip extra" title="实然多出来的权限（档案里没有）">' + esc(p) + ' +</span>';
      });
    }
    html += '</div>';

    if(!a.permissionsInSync){
      html += '<div class="diff-note">'
        + '档案与生效权限不一致：'
        + (missing.length ? '缺 ' + missing.length + ' 项；' : '')
        + (extra.length ? '多 ' + extra.length + ' 项；' : '')
        + '通常在状态流转（暂停/停用/离职）时出现，属于回收动作没走完。</div>';
    } else {
      html += '<div class="diff-note">档案与生效权限一致。</div>';
    }

    $("d-body").innerHTML = html;
    $("drawer").classList.add("show");
    $("drawer-mask").classList.add("show");
  };

  window.closeDrawer = function(){
    $("drawer").classList.remove("show");
    $("drawer-mask").classList.remove("show");
  };

  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDrawer(); });

  boot();
})();
</script>
</body>
</html>
