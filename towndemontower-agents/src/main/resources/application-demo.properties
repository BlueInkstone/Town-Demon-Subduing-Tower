# [agents] 演示 profile：独立端口 + 演示数据播种
# 与交付看板（8080）并存，因此这里固定 8081，避免端口冲突。
server.port=8081

towndemontower.agents.enabled=true
towndemontower.agents.governed=true
towndemontower.agents.demo-data=true
towndemontower.agents.seed-mode=default
towndemontower.agents.storage=memory

# 接口文档
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
